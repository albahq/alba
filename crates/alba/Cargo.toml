[package]
name = "alba"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Alba, the Beamfile task runner: parallel beams, caching, watch mode, and an interactive interface"
readme = "../../README.md"
keywords = ["task-runner", "build", "make", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "alba"
path = "src/main.rs"

[dependencies]
alba-core.workspace = true
alba-engine.workspace = true
alba-executors.workspace = true
alba-shell.workspace = true
alba-syntax.workspace = true
alba-tui.workspace = true
clap.workspace = true
owo-colors.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
portable-pty.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal"] }
