[package]
name = "alba-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Alba's embedded shell: a deterministic, cross-platform, POSIX-like interpreter for beam commands"

[dependencies]
glob = { workspace = true }
os_pipe = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

# No libtest harness: the conformance binary doubles as the external
# command its spawning cases invoke, and libtest's own output around a
# test would leave nothing a frozen stdout expectation could match. See
# the module comment in `tests/conformance.rs`.
[[test]]
name = "conformance"
harness = false
