[package]
name = "alba-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `fancy-no-backtrace` is the minimal miette feature set that exposes
# `GraphicalReportHandler`/`GraphicalTheme` (gated behind `fancy-base`, see
# miette's Cargo.toml). It has to be a normal dependency feature rather
# than a dev-only one, because `render_diagnostic` is a library function
# the CLI calls in production. We pick `fancy-no-backtrace` over the full `fancy`
# to skip the `backtrace`/`backtrace-ext` dependencies, which only serve
# `fancy`'s panic-hook integration; we render diagnostics directly and never
# install that hook.
miette = { workspace = true, features = ["fancy-no-backtrace"] }

[dev-dependencies]
insta.workspace = true
