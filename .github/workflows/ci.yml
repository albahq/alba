name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the matrix be run on demand against any branch, without
  # opening a throwaway pull request to fire the trigger.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # `rust-toolchain.toml` already pins `channel = "stable"` with the
      # `rustfmt` and `clippy` components. Requesting the same channel and
      # components here is intentionally redundant, not conflicting: both
      # resolve to the same rustup toolchain, so this step just guarantees
      # that toolchain is installed and up to date before rustup picks it
      # up via the toolchain file for every subsequent `cargo` invocation.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `--all-features` matters here: `alba-executors`'s `test-util`
      # feature (enabled by `alba-engine`'s dev-dependencies) gates code
      # that a bare `--workspace` build, clippy pass, or test run would
      # silently skip. This is the same gate used throughout local
      # development, so CI checks exactly what was developed against.
      - name: Build
        run: cargo build --workspace --all-features

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The wall-clock budgets are `#[ignore]`d in the default run because
      # the rest of the suite running beside them is enough load to break
      # an absolute budget. Here each one runs alone in its test binary,
      # on every platform. `--exact` keeps the other ignored tests out.
      - name: Performance
        run: >-
          cargo test --workspace --all-features -- --ignored --exact
          load_project_stays_under_10ms_of_work
          a_fully_cached_run_stays_imperceptible
          affected::tests::affected_selection_stays_imperceptible

      # The docker and compose executors' integration tests are
      # `#[ignore]`d because they need a running daemon; the ubuntu runner
      # has one, the macOS and windows runners do not. The wall-clock
      # budgets already ran alone in the step above.
      - name: Test (docker and compose executors)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --workspace --all-features -- --ignored
          --skip load_project_stays_under_10ms_of_work
          --skip a_fully_cached_run_stays_imperceptible
          --skip affected_selection_stays_imperceptible
