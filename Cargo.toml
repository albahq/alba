[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/albahq/alba"

[workspace.dependencies]
alba-core = { path = "crates/alba-core", version = "0.2.1" }
alba-engine = { path = "crates/alba-engine", version = "0.2.1" }
alba-executors = { path = "crates/alba-executors", version = "0.2.1" }
alba-shell = { path = "crates/alba-shell", version = "0.2.1" }
alba-syntax = { path = "crates/alba-syntax", version = "0.2.1" }
alba-tui = { path = "crates/alba-tui", version = "0.2.1" }
ansi-to-tui = "7"
arboard = "3"
assert_cmd = "2"
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
miette = "7"
nix = "0.29"
notify = "8"
notify-debouncer-full = "0.7"
os_pipe = "1"
owo-colors = "4"
portable-pty = "0.9"
predicates = "3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
which = "7"
insta = "1"
tempfile = "3"
unicode-width = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
