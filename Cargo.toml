[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jdevelop-io/alba"

[workspace.dependencies]
assert_cmd = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
miette = "7"
nix = "0.29"
owo-colors = "4"
predicates = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
insta = "1"
tempfile = "3"
